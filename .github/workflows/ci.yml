name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        env:
          MONGO_URI: "mongodb://localhost:27017/forense_test"
          LOGIN_USER: admin
          LOGIN_PASS: senha_ci
          SECRET_KEY: chave_ci_super_secreta
        run: pytest --tb=short -q
