name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install --disable-pip-version-check -q -r requirements-dev.txt

      - name: Verificar qualidade do código
        run: ruff check .

      - name: Executar testes
        id: pytest
        continue-on-error: true
        run: pytest -q > pytest.log 2>&1

      - name: Publicar diagnóstico dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic
          path: backend/pytest.log
          retention-days: 1

      - name: Validar resultado dos testes
        if: steps.pytest.outcome == 'failure'
        run: |
          cat pytest.log
          exit 1
