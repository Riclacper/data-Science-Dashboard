<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - Dashboard Forense</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 320px;
    }

    h2 {
      margin-bottom: 20px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin: 0 auto;
      display: block;
    }

    button:hover {
      background-color: #218838;
    }

    #erroLogin {
      color: #c0392b;
      margin-top: 12px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="../backend/logo.png" alt="Logo" style="width: 120px; display: block; margin: 0 auto 16px auto;">
    <input type="text" id="usuario" placeholder="Usuário" />
    <input type="password" id="senha" placeholder="Senha" onkeydown="checarEnter(event)" />
    <button onclick="fazerLogin()">Entrar</button>
    <p id="erroLogin"></p>
  </div>

  <script>
    const API = 'http://127.0.0.1:5000';

    async function fazerLogin() {
      const usuario = document.getElementById('usuario').value;
      const senha = document.getElementById('senha').value;
      const erroEl = document.getElementById('erroLogin');
      erroEl.textContent = '';

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, senha })
        });
        const data = await res.json();

        if (data.ok) {
          localStorage.setItem('usuario_logado', 'true');
          window.location.href = 'index.html';
        } else {
          erroEl.textContent = data.erro || 'Usuário ou senha incorretos.';
        }
      } catch (e) {
        erroEl.textContent = 'Erro ao conectar com o servidor.';
      }
    }

    function checarEnter(e) {
      if (e.key === 'Enter') {
        fazerLogin();
      }
    }

    if (localStorage.getItem('usuario_logado') === 'true') {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
