version: "3.9"

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./model:/app/model
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
