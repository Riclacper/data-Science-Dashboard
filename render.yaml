# render.yaml — Configuração de deploy no Render.com
# Documentação: https://render.com/docs/render-yaml-spec
#
# Como usar:
# 1. Crie um novo Blueprint no Render apontando para este repositório.
# 2. Preencha as variáveis de ambiente marcadas como sync: false no painel do Render.
# 3. Após o backend subir, copie a URL gerada (ex: https://forense-backend.onrender.com)
#    e atualize frontend/config.js com essa URL antes do próximo deploy.

services:
  # ── Backend: Flask Web Service ──────────────────────────────────────────────
  - type: web
    name: forense-backend
    runtime: python
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd backend && python train_model_avaliado.py
    startCommand: cd backend && python app.py
    envVars:
      - key: MONGO_URI
        sync: false          # preencha no painel do Render
      - key: LOGIN_USER
        sync: false
      - key: LOGIN_PASS
        sync: false
      - key: SECRET_KEY
        generateValue: true  # gerado automaticamente pelo Render
      - key: EMAIL_ORIGEM
        sync: false
      - key: SENHA_APP
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: FLASK_ENV
        value: production

  # ── Frontend: Static Site ───────────────────────────────────────────────────
  - type: web
    name: forense-frontend
    runtime: static
    staticPublishPath: ./frontend
    # Após o backend subir, atualize a URL em frontend/config.js e faça novo deploy.
